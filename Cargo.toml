[package]
name = "voca_rs"
version = "1.15.3"
rust-version = "1.85"
authors = ["A. Mereżany <a.merezany@gmail.com>"]
license = "MIT"
description = "Voca_rs is a Rust library for manipulating [unicode] strings"

documentation = "https://docs.rs/voca_rs/"
repository = "https://github.com/jlogicsoftware/voca_rs"

keywords = ["string", "case", "snake", "camel", "unicode"]
categories = ["encoding"]
readme = "README.md"
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE.md", "THIRD-PARTY-NOTICES.md"]

[dependencies]
regex = "1.13.2"
stfu8 = "0.2.7"
unicode-segmentation = "1.13.3"
unidecode = "0.3.0"

[profile.dev]
lto = true
opt-level = 0

[profile.release]
opt-level = 3
